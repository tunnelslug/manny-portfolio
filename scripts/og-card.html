<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Schibsted Grotesk";
        font-style: normal;
        font-weight: 400;
        src: url("/public/fonts/schibsted-latin-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Schibsted Grotesk";
        font-style: normal;
        font-weight: 700;
        src: url("/public/fonts/schibsted-latin-700.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f4f0ea;
        color: #2c2218;
        font-family: "Schibsted Grotesk", ui-sans-serif, sans-serif;
      }
      .band { display: flex; height: 10px; }
      .band span { flex: 1; }
      main {
        height: calc(630px - 10px);
        padding: 72px 80px 56px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .eyebrow {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #b4532a;
        margin-bottom: 22px;
      }
      h1 {
        font-size: 88px;
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 0.92;
        margin-bottom: 22px;
      }
      .role {
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.02em;
        margin-bottom: 14px;
      }
      .thesis {
        font-size: 22px;
        font-weight: 400;
        color: #6a5b4e;
        max-width: 18em;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 16px;
        font-weight: 500;
        color: #6a5b4e;
      }
    </style>
  </head>
  <body>
    <div class="band" aria-hidden="true">
      <span style="background:#E6376A"></span>
      <span style="background:#1E4FA6"></span>
      <span style="background:#D6A03B"></span>
      <span style="background:#C25425"></span>
      <span style="background:#4A7F5C"></span>
      <span style="background:#1F3F8C"></span>
      <span style="background:#1B1208"></span>
    </div>
    <main>
      <div>
        <div class="eyebrow">Identity &amp; access</div>
        <h1>Manny Flores</h1>
        <p class="role">Senior Systems Engineer · Corporate Systems lead</p>
        <p class="thesis">Identity and access management. Governance for AI agents.</p>
      </div>
      <footer>
        <span>mannyflo.com</span>
        <span>Robinhood · SF Bay Area</span>
      </footer>
    </main>
  </body>
</html>
