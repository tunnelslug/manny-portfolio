<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 7'%3E%3Crect width='1' height='7' x='0' fill='%23E6376A'/%3E%3Crect width='1' height='7' x='1' fill='%231E4FA6'/%3E%3Crect width='1' height='7' x='2' fill='%23D6A03B'/%3E%3Crect width='1' height='7' x='3' fill='%23C25425'/%3E%3Crect width='1' height='7' x='4' fill='%234A7F5C'/%3E%3Crect width='1' height='7' x='5' fill='%231F3F8C'/%3E%3Crect width='1' height='7' x='6' fill='%231B1208'/%3E%3C/svg%3E" />
    <title>404 · Manny Flores</title>
    <style>
      @font-face {
        font-family: "Schibsted Grotesk";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/schibsted-latin-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Schibsted Grotesk";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/schibsted-latin-700.woff2") format("woff2");
      }
      :root {
        --bg: oklch(97.2% 0.008 72);
        --text: oklch(22% 0.016 48);
        --muted: oklch(39% 0.014 50);
        --accent: oklch(52% 0.145 42);
        --border: oklch(22% 0.016 48 / 14%);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(18.5% 0.012 52);
          --text: oklch(93% 0.012 75);
          --muted: oklch(74% 0.012 70);
          --accent: oklch(72% 0.130 48);
          --border: oklch(93% 0.012 75 / 16%);
        }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .band { display: flex; height: 5px; }
      .band span { flex: 1; }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .panel { max-width: 480px; width: 100%; }
      .code {
        font-size: clamp(3rem, 12vw, 5rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        color: var(--text);
        line-height: 0.95;
        margin-bottom: 12px;
      }
      p { font-size: 1.05rem; color: var(--muted); line-height: 1.55; }
      a {
        display: inline-block;
        margin-top: 24px;
        color: var(--accent);
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 600;
        border-bottom: 1px solid var(--accent);
        padding-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <div class="band" role="presentation">
      <span style="background:#E6376A"></span><span style="background:#1E4FA6"></span><span style="background:#D6A03B"></span><span style="background:#C25425"></span><span style="background:#4A7F5C"></span><span style="background:#1F3F8C"></span><span style="background:#1B1208"></span>
    </div>
    <main>
      <div class="panel">
        <div class="code">404</div>
        <p>This page is not here. It was never issued, or it moved.</p>
        <a href="/">Back to mannyflo.com</a>
      </div>
    </main>
  </body>
</html>
