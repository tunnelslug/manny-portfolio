<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 7'%3E%3Crect width='1' height='7' x='0' fill='%23E6376A'/%3E%3Crect width='1' height='7' x='1' fill='%231E4FA6'/%3E%3Crect width='1' height='7' x='2' fill='%23D6A03B'/%3E%3Crect width='1' height='7' x='3' fill='%23C25425'/%3E%3Crect width='1' height='7' x='4' fill='%234A7F5C'/%3E%3Crect width='1' height='7' x='5' fill='%231F3F8C'/%3E%3Crect width='1' height='7' x='6' fill='%231B1208'/%3E%3C/svg%3E" />
    <title>404 · Manny Flores</title>
    <style>
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/plexmono-latin-400.woff2") format("woff2");
      }
      :root {
        --bg: oklch(97.8% 0.005 75);
        --text: oklch(21% 0.012 50);
        --muted: oklch(41% 0.012 50);
        --accent: oklch(56% 0.145 42);
        --revoke: oklch(48% 0.15 27);
        --border: oklch(20.5% 0.012 50 / 16%);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(15.5% 0.010 50);
          --text: oklch(92% 0.010 75);
          --muted: oklch(73% 0.010 70);
          --accent: oklch(70% 0.135 48);
          --revoke: oklch(70% 0.150 25);
          --border: oklch(92% 0.010 75 / 18%);
        }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .band { display: flex; height: 5px; }
      .band span { flex: 1; }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .panel { max-width: 560px; width: 100%; }
      .line { font-size: 0.85rem; line-height: 2.1; color: var(--muted); }
      .line .deny { color: var(--revoke); }
      .code {
        font-size: clamp(3rem, 12vw, 5rem);
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--text);
        margin: 12px 0 8px;
      }
      p { font-size: 0.9rem; color: var(--muted); line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 24px;
        color: var(--accent);
        text-decoration: none;
        font-size: 0.85rem;
        border-bottom: 1px solid var(--accent);
        padding-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <div class="band" role="presentation">
      <span style="background:#E6376A"></span><span style="background:#1E4FA6"></span><span style="background:#D6A03B"></span><span style="background:#C25425"></span><span style="background:#4A7F5C"></span><span style="background:#1F3F8C"></span><span style="background:#1B1208"></span>
    </div>
    <main>
      <div class="panel">
        <div class="line">▸ resource lookup · <span class="deny">not_found</span></div>
        <div class="code">404</div>
        <p>This path has no resource behind it. Not revoked, not denied: it never existed, or it moved.</p>
        <a href="/">return to mannyflo.com</a>
      </div>
    </main>
  </body>
</html>
