<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23b85c32'/%3E%3C/svg%3E" />
    <title>Not found · Manny Flores</title>
    <style>
      @font-face {
        font-family: "Source Serif 4";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/fonts/source-serif-4-latin-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "Source Sans 3";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/source-sans-3-latin-400.woff2") format("woff2");
      }
      :root {
        --bg: oklch(97.2% 0.012 78);
        --text: oklch(24% 0.018 48);
        --muted: oklch(42% 0.016 48);
        --accent: oklch(52% 0.145 42);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(22% 0.016 55);
          --text: oklch(93% 0.012 78);
          --muted: oklch(76% 0.012 70);
          --accent: oklch(72% 0.125 48);
        }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      main { max-width: 28rem; }
      h1 {
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
      }
      p { color: var(--muted); line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 24px;
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Not here</h1>
      <p>This path does not have a page behind it.</p>
      <a href="/">Back to mannyflo.com</a>
    </main>
  </body>
</html>
